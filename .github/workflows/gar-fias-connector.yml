name: Text2me GAR-FIAS connector
# A commit containing [run-gar-fias-preflight] checks source/size headers only; it does not download the archive.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 2"
permissions:
  contents: write
concurrency:
  group: text2me-gar-fias-connector
  cancel-in-progress: true
jobs:
  check-official-release:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-gar-fias]') || contains(github.event.head_commit.message, '[run-gar-fias-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test connector helpers
        run: python -m unittest discover -s data-engine -p 'test_*.py' -v
      - name: Test GAR SQLite builder and search
        run: python scripts/test-build-gar-index.py
      - name: Check official FNS feed and build index when a new archive fits runner limits
        env:
          GAR_INDEX_OUTPUT: ${{ runner.temp }}/gar-address-index.sqlite
          GAR_PREFLIGHT_ONLY: ${{ contains(github.event.head_commit.message, '[run-gar-fias-preflight]') }}
        run: python data-engine/fias_connector.py
      - name: Commit connector status for the public site
        run: |
          if ! git diff --quiet -- data-engine/status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data-engine/status.json
            git commit -m "chore: update GAR/FIAS connector status"
            git push origin HEAD:main
          fi
      - name: Fail the run if the source check failed
        if: always()
        run: python data-engine/fias_connector.py --assert-success
      - name: Detect built index artifact
        id: index-artifact
        if: always()
        env:
          GAR_INDEX_OUTPUT: ${{ runner.temp }}/gar-address-index.sqlite
        run: |
          if [ -f "$GAR_INDEX_OUTPUT" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload built SQLite address index
        if: steps.index-artifact.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: text2me-gar-address-index-${{ github.run_id }}
          path: ${{ runner.temp }}/gar-address-index.sqlite
          if-no-files-found: error
          retention-days: 14
      - name: Upload public status snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text2me-gar-fias-status
          path: data-engine/status.json
          if-no-files-found: error
          retention-days: 14
