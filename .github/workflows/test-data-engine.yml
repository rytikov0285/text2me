name: Test text2me data engine
on:
  push:
    branches: [main]
    paths:
      - "data-engine/**"
      - ".github/workflows/test-data-engine.yml"
  pull_request:
    paths:
      - "data-engine/**"
      - ".github/workflows/test-data-engine.yml"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run connector unit tests
        run: python -m unittest discover -s data-engine -p 'test_*.py' -v
