name: Validate reference-data engine

on:
  pull_request:
    paths:
      - "data-engine/**"
      - "scripts/validate-reference-data.mjs"
      - "scripts/build-gar-index.py"
      - "scripts/test-build-gar-index.py"
      - "scripts/search-gar-index.py"
      - ".github/workflows/**"
  push:
    paths:
      - "data-engine/**"
      - "scripts/validate-reference-data.mjs"
      - "scripts/build-gar-index.py"
      - "scripts/search-gar-index.py"
      - "scripts/test-build-gar-index.py"
      - "scripts/inspect-gar-xml.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate reference registry and connector status
        run: node scripts/validate-reference-data.mjs
      - name: Compile official GAR connector
        run: python3 -m py_compile data-engine/fias_connector.py
      - name: Test official connector helpers
        run: python3 -m unittest discover -s data-engine -p 'test_*.py' -v
      - name: Compile Python data-engine scripts
        run: python3 -m py_compile scripts/build-gar-index.py scripts/search-gar-index.py scripts/test-build-gar-index.py scripts/inspect-gar-xml.py
      - name: Run synthetic GAR index regression test
        run: python3 scripts/test-build-gar-index.py
