name: Validate personal workspace

on:
  push:
    paths:
      - "dashboard/**"
      - "calendar/**"
      - "assets/enhancements.js"
      - "assets/unified-workspace.js"
      - "assets/crm-workspace.js"
      - "assets/space-dashboard.js"
      - "assets/document-workflow.js"
      - "index.html"
      - "sitemap.xml"
      - "data-engine/user-workspace-schema.json"
      - "scripts/validate-workspace.mjs"
      - "scripts/test-workspace-relations.mjs"
      - ".github/workflows/validate-workspace.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "calendar/**"
      - "assets/enhancements.js"
      - "assets/unified-workspace.js"
      - "assets/crm-workspace.js"
      - "assets/space-dashboard.js"
      - "assets/document-workflow.js"
      - "data-engine/user-workspace-schema.json"
      - "scripts/validate-workspace.mjs"
      - "scripts/test-workspace-relations.mjs"
      - ".github/workflows/validate-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workspace markup and schema
        run: node scripts/validate-workspace.mjs
      - name: Test relationships and safe deletion
        run: node scripts/test-workspace-relations.mjs
