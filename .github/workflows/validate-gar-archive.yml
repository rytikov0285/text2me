name: Validate GAR-FIAS archive

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: "Необязательно: точная ссылка на ZIP из официальных метаданных ФИАС"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: gar-fias-archive-validation
  cancel-in-progress: false

jobs:
  validate-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ZIP utilities
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Download and validate official archive
        id: validate
        continue-on-error: true
        env:
          GAR_ARCHIVE_URL: ${{ inputs.archive_url }}
          GAR_MAX_ARCHIVE_BYTES: "12884901888"
          GAR_INDEX_OUTPUT: ${{ runner.temp }}/gar-address-index.sqlite
        run: node scripts/validate-gar-archive.mjs
      - name: Upload validated SQLite index artifact
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gar-address-index-${{ github.run_id }}
          path: ${{ runner.temp }}/gar-address-index.sqlite
          if-no-files-found: error
          retention-days: 7
      - name: Publish validation result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-engine/status.json
          if git diff --cached --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "Record GAR-FIAS archive validation result"
            git push
          fi
      - name: Mark validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1
